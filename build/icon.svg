<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <!-- Rack cabinet -->
  <rect x="58" y="34" width="124" height="188" rx="14" fill="#0b1220" stroke="#e2e8f0" stroke-width="8"/>
  <!-- Rails -->
  <rect x="72" y="50" width="6" height="156" rx="2" fill="#64748b"/>
  <rect x="162" y="50" width="6" height="156" rx="2" fill="#64748b"/>
  <!-- Servers -->
  <g>
    <rect x="80" y="54" width="80" height="30" rx="5" fill="url(#unit)"/>
    <rect x="88" y="65" width="40" height="8" rx="2" fill="#0b1220"/>
    <circle cx="146" cy="69" r="5" fill="#22c55e"/>

    <rect x="80" y="92" width="80" height="30" rx="5" fill="url(#unit)"/>
    <rect x="88" y="103" width="40" height="8" rx="2" fill="#0b1220"/>
    <circle cx="146" cy="107" r="5" fill="#22c55e"/>

    <rect x="80" y="130" width="80" height="30" rx="5" fill="url(#unit)"/>
    <rect x="88" y="141" width="40" height="8" rx="2" fill="#0b1220"/>
    <circle cx="146" cy="145" r="5" fill="#f59e0b"/>

    <rect x="80" y="168" width="80" height="30" rx="5" fill="url(#unit)"/>
    <rect x="88" y="179" width="40" height="8" rx="2" fill="#0b1220"/>
    <circle cx="146" cy="183" r="5" fill="#22c55e"/>
  </g>
  <!-- Patch cable looping out of the rack -->
  <path d="M158 69 C 214 69, 214 145, 158 145" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
  <circle cx="158" cy="69" r="6" fill="#fbbf24"/>
  <circle cx="158" cy="145" r="6" fill="#fbbf24"/>
</svg>
